name: Data fixture tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.10.10"
          python-version: "3.13"
          enable-cache: false
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Run offline fixture tests
        run: uv run --locked python -m unittest discover -s pipelines/tests -v
